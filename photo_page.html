<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sweet Moment 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffc3a0 0%, #ffafbd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffc3a0 0%, #ffafbd 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-icon {
            font-size: 4rem;
            margin-bottom: 25px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .splash-text {
            font-size: 1.8rem;
            color: #c2185b;
            margin-bottom: 25px;
            text-align: center;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .splash-icon {
                font-size: 3.5rem;
                margin-bottom: 20px;
            }
            .splash-text {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .splash-icon {
                font-size: 3rem;
                margin-bottom: 18px;
            }
            .splash-text {
                font-size: 1.3rem;
                margin-bottom: 18px;
            }
        }

        .enter-button {
            padding: 18px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #c2185b, #d81b60);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(194, 24, 91, 0.4);
            transition: all 0.3s ease;
            font-family: 'Georgia', serif;
            animation: pulse 2s infinite;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(194, 24, 91, 0.5);
        }

        .enter-button:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .enter-button {
                padding: 16px 38px;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .enter-button {
                padding: 14px 32px;
                font-size: 1rem;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .photo-container {
            text-align: center;
            animation: fadeInScale 1.5s ease-out;
            position: relative;
            z-index: 10;
            padding: 0 15px;
        }

        @media (max-width: 480px) {
            .photo-container {
                padding: 0 10px;
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .photo-frame {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: inline-block;
            max-width: 95%;
        }

        @media (max-width: 768px) {
            .photo-frame {
                padding: 15px;
                border-radius: 15px;
            }
        }

        @media (max-width: 480px) {
            .photo-frame {
                padding: 10px;
                border-radius: 10px;
            }
        }

        .photo {
            max-width: 600px;
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        @media (max-width: 480px) {
            .photo {
                border-radius: 8px;
            }
        }

        .caption {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #c2185b;
            font-style: italic;
            animation: pulse 2s infinite;
        }

        @media (max-width: 768px) {
            .caption {
                font-size: 1.3rem;
                margin-top: 15px;
            }
        }

        @media (max-width: 480px) {
            .caption {
                font-size: 1.1rem;
                margin-top: 12px;
            }
        }

        .falling-heart {
            position: absolute;
            font-size: 2rem;
            animation: fall linear;
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .falling-heart {
                font-size: 1.5rem;
            }
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="splash-icon">💕</div>
        <div class="splash-text">Click to see our sweet moment</div>
        <button class="enter-button" id="enterButton">Enter 💖</button>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const splashScreen = document.getElementById('splashScreen');
        const mainContent = document.getElementById('mainContent');
        const enterButton = document.getElementById('enterButton');
        
        enterButton.addEventListener('click', function() {
            // Play the audio
            audio.play().then(() => {
                console.log('Music started playing!');
            }).catch(err => {
                console.log('Failed to play audio:', err);
            });
            
            // Hide splash screen and show main content
            splashScreen.classList.add('hidden');
            mainContent.style.display = 'block';
            
            // Start falling hearts
            startHearts();
        });

        const heartEmojis = ['❤️', '💕', '💖', '💗', '💝', '💓', '💞', '🍫'];

        function createFallingHeart() {
            const heart = document.createElement('div');
            heart.className = 'falling-heart';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        function startHearts() {
            // Create hearts continuously
            setInterval(createFallingHeart, 200);

            // Initial batch
            for (let i = 0; i < 15; i++) {
                setTimeout(createFallingHeart, i * 100);
            }
        }
    </script>
